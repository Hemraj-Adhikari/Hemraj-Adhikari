<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#4f9cf9"/>
    </linearGradient>
    <style>
      .name { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .tag  { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #dbeafe; letter-spacing: 1px; }
      .fade { opacity: 0; animation: fadeIn 1.2s ease-out forwards; }
      .fade2 { opacity: 0; animation: fadeIn 1.2s ease-out 0.4s forwards; }
